<!-- Exercise 01 — HeaderComponent Template -->
<!-- Task 2, Step 7: nav with portal name and links Home, Courses, Profile -->
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-icon">🎓</span>
      <span class="brand-name">Student Course Portal</span>
    </div>
    <nav class="nav" aria-label="Main navigation">
      <a routerLink="/"        routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
      <a routerLink="/courses" routerLinkActive="active">Courses</a>
      <a routerLink="/profile" routerLinkActive="active">Profile</a>
      <a routerLink="/enroll"  routerLinkActive="active">Enroll</a>
    </nav>
  </div>
</header>
