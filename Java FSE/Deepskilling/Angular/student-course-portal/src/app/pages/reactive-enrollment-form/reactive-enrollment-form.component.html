<!-- Exercise 05 — Reactive Enrollment Form Template -->
<!-- formGroup, formControlName, FormArray, custom errors -->

<div class="form-page">
  <h1 class="page-title">Enrollment Form (Reactive)</h1>
  <p class="page-desc">Reactive Form — Exercise 05</p>

  <div class="success-banner" *ngIf="submitted">✅ Reactive enrollment submitted!</div>

  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()" class="enroll-form" *ngIf="!submitted">

    <!-- studentName -->
    <div class="form-group">
      <label>Student Name *</label>
      <input type="text" formControlName="studentName" placeholder="Full name">
      <span class="error-msg" *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['required']">Name is required.</span>
      <span class="error-msg" *ngIf="enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['minlength']">Min 3 characters required.</span>
    </div>

    <!-- studentEmail with async validator -->
    <div class="form-group">
      <label>Email *</label>
      <input type="email" formControlName="studentEmail" placeholder="student@example.com">
      <span class="error-msg" *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['required']">Email is required.</span>
      <span class="error-msg" *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['email']">Enter a valid email.</span>
      <!-- Step 55: async validator error -->
      <span class="error-msg" *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['emailTaken']">This email is already taken.</span>
      <span class="info-msg" *ngIf="enrollForm.get('studentEmail')?.pending">Checking email...</span>
    </div>

    <!-- courseId with custom validator -->
    <div class="form-group">
      <label>Course Code *</label>
      <input type="text" formControlName="courseId" placeholder="e.g. CS101">
      <span class="error-msg" *ngIf="enrollForm.get('courseId')?.touched && enrollForm.get('courseId')?.errors?.['required']">Course code is required.</span>
      <!-- Step 54: Custom validator error -->
      <span class="error-msg" *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">Course code starting with XX is not allowed.</span>
    </div>

    <!-- preferredSemester -->
    <div class="form-group">
      <label>Preferred Semester *</label>
      <select formControlName="preferredSemester">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <!-- agreeToTerms -->
    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" formControlName="agreeToTerms">
        I agree to the terms and conditions *
      </label>
    </div>

    <!-- Exercise 05 — Step 56: FormArray for dynamic additional courses -->
    <div class="form-group">
      <label>Additional Courses</label>
      <div formArrayName="additionalCourses">
        <div *ngFor="let ctrl of additionalCourses.controls; let i = index" class="array-row">
          <input type="text" [formControl]="$any(ctrl)" placeholder="Course code">
          <button type="button" class="btn btn-secondary btn-sm" (click)="removeCourse(i)">Remove</button>
        </div>
      </div>
      <button type="button" class="btn btn-secondary" (click)="addCourse()">+ Add Another Course</button>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="enrollForm.invalid">Submit</button>
      <button type="button" class="btn btn-secondary" (click)="enrollForm.reset()">Reset</button>
    </div>
  </form>
</div>
